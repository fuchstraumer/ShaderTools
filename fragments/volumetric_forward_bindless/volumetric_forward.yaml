---

buffer_references :
    # For use with bindless resources and device address extensions, we declare our types that will be used
    # as buffer references upfront here. We then reference them in the resource group definitions, allowing us to 
    # hopefully minimally disrupt non-bindless uses of this library
    # This is partially required because the buffer references declare schemas of structs that are effectively just stored
    # as buckets of bytes in a storage buffer. This buffer_reference type just tells the compiler how to interpret the data
    MaterialIndices:
        IsArray : true
        # Alignment can be manually specified, or left to "Auto" for us to determine based on size of contained type and nearest friendly alignment
        Alignment : "Auto"
        Members: |+1
            int albedoMapIdx;
            int alphaMapIdx;
            int specularMapIdx;
            int bumpMapIdx;
            int displacementMapIdx;
            int normalMapIdx;
            int aoMapIdx;
            int metallicMapIdx;
            int roughnessMapIdx;
            int emissiveMapIdx;
    MaterialParameters:
        IsArray : true
        Alignment : "Auto"
        Members: |+1
            vec3 ambient;
            vec3 diffuse;
            vec3 specular;
            vec3 transmittance;
            vec3 emissive;
            float shininess;
            float ior;
            float dissolve;
            int illum;
            float roughness;
            float metallic;
            float sheen;
            float clearcoat_thickness;
            float clearcoat_roughness;
            float anisotropy;
            float anisotropy_rotation;
            float height_scale;
    PointLights:
        IsArray : true
        Alignment : "Auto"
        Members: |+1
            vec4 Position;
            vec4 PositionViewSpace;
            vec3 Color;
            float Range;
            float Intensity;
            bool Enabled;
            vec2 Padding;
    SpotLights:
        IsArray : true
        Alignment : "Auto"
        Members: |+1
            vec4 Position;
            vec4 PositionViewSpace;
            vec3 Color;
            float Range;
            float Intensity;
            bool Enabled;
            float InnerConeAngleCosine;
            float OuterConeAngleCosine;
    DirectionalLights:
        IsArray : true
        Alignment : "Auto"
        Members: |+1
            vec4 Direction;
            vec4 DirectionViewSpace;
            vec3 Color;
            float Intensity;
            bool Enabled;
            vec3 Padding;
    

resource_groups : 
    GlobalUniformBuffers : 
        GlobalMatrices : 
            Type : "UniformBuffer"
            Members : |+1
                mat4 model;
                mat4 view;
                mat4 inverseView;
                mat4 projection;   
        Globals : 
            Type : "UniformBuffer"
            Members : |+1
                vec4 viewPosition;
                vec2 mousePosition;
                vec2 windowSize;
                vec2 depthRange;
                uint frame;
                float exposure;
                float gamma;
                float brightness;
    BindlessResources :
        BindlessSamplers : 
            Type : "SamplerArray"
        BindlessTextures :
            Type : "SampledImageArray"
    Material :
        MaterialIndices :
            Type : "StorageBufferArray"
            Members : |+1
                int parametersIdx;
                int albedoMapIdx;
                int alphaMapIdx;
                int specularMapIdx;
                int bumpMapIdx;
                int displacementMapIdx;
                int normalMapIdx;
                int aoMapIdx;
                int metallicMapIdx;
                int roughnessMapIdx;
                int emissiveMapIdx;
            Qualifiers: "restrict readonly"
            ArraySize : 16384
        MaterialParameters : 
            Type : "StorageBufferArray"   
            Members : |+1
                vec3 ambient;
                vec3 diffuse;
                vec3 specular;
                vec3 transmittance;
                vec3 emissive;
                float shininess;
                float ior;
                float dissolve;
                int illum;
                float roughness;
                float metallic;
                float sheen;
                float clearcoat_thickness;
                float clearcoat_roughness;
                float anisotropy;
                float anisotropy_rotation;
                float height_scale;
            Qualifiers: "restrict readonly"
            ArraySize : 16384
        BindlessTextureArray :
            ArraySize : 16384
            Type : "SampledImageArray"
        LinearRepeatSampler : 
            Type : "Sampler"
        LinearClampSampler : 
            Type : "Sampler"
        AnisotropicSampler : 
            Type : "Sampler"
    VolumetricForward : 
        ClusterData : 
            Type : "UniformBuffer"
            Members : |+1
                uvec3 GridDim;
                float ViewNear;
                uvec2 ScreenSize;
                float NearK;
                float LogGridDimY;
        ClusterAABBs : 
            Type : "StorageBuffer"
            Qualifiers : "restrict"
            Members : |+1
                AABB Data[];
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "readonly"   
        ClusterFlags : 
            Type : "StorageTexelBuffer"
            Format : "r8ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                FindUniqueClusters : "readonly"
                ClusterSamples : "writeonly" 
        PointLightIndexList : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "writeonly"
                Clustered : "readonly"
        SpotLightIndexList : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "writeonly"
                Clustered : "readonly"
        PointLightGrid : 
            Type : "StorageTexelBuffer"
            Format : "rg32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "writeonly"
                Clustered : "readonly"
        SpotLightGrid : 
            Type : "StorageTexelBuffer"
            Format : "rg32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "writeonly"
                Clustered : "readonly"
        PointLightIndexCounter : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
        SpotLightIndexCounter : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
        UniqueClustersCounter : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                UpdateClusterIndirectArgs : "readonly"
        UniqueClusters : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "readonly"
                FindUniqueClusters : "writeonly"
    VolumetricForwardLights : 
        LightCounts : 
            Type : "UniformBuffer"
            Members : |+1
                uint NumPointLights;
                uint NumSpotLights;
                uint NumDirectionalLights;
        PointLights : 
            Type : "StorageBuffer"
            Members : |+1
                PointLight Data[];
            # PerUsageQualifiers: qualifiers to apply only to single shaders in the pack
            # Other qualifiers are applied pack-wide
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                Clustered : "readonly"
                ReduceLightsAABB : "readonly"
                ComputeMortonCodes : "readonly"
                AssignLightsToClustersBVH : "readonly"
        SpotLights : 
            Type : "StorageBuffer"
            Members : |+1
                SpotLight Data[];
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                Clustered : "readonly"
                ReduceLightsAABB : "readonly"
                ComputeMortonCodes : "readonly"
                AssignLightsToClustersBVH : "readonly"
        DirectionalLights : 
            Type : "StorageBuffer"
            Members : |+1
                DirectionalLight Data[];
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                Clustered : "readonly"
                ReduceLightsAABB : "readonly"
                ComputeMortonCodes : "readonly"
    IndirectArgsSet : 
        IndirectArgs : 
            Type : "StorageBuffer"
            Members : |+1
                uint NumThreadGroupsX;
                uint NumThreadGroupsY;
                uint NumThreadGroupsZ;
                uint Padding;
            Qualifiers : "restrict"
    SortResources :
        LightAABBs : 
            Type : "StorageBuffer"
            Members : |+1
                AABB Data[];
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                ComputeMortonCodes : "readonly"   
        PointLightMortonCodes : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"    
        SpotLightMortonCodes : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"    
        PointLightIndices : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"   
        SpotLightIndices : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict"
    MergeSortResources : 
        InputKeys : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict readonly"
        InputValues : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict readonly"
        OutputKeys : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict writeonly"
        OutputValues : 
            Type : "StorageTexelBuffer"
            Format : "r32ui"
            Qualifiers : "restrict writeonly"
        MergePathPartitions : 
            Type : "StorageTexelBuffer"
            Format : "r32i"
            Qualifiers : "restrict"
    BVHResources : 
        BVHParams : 
            Type : "UniformBuffer"
            Members : |+1
                uint PointLightLevels;
                uint SpotLightLevels;
                uint ChildLevel;
        PointLightBVH : 
            Type : "StorageBuffer"
            Members : |+1
                AABB Data[];
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "readonly" 
        SpotLightBVH : 
            Type : "StorageBuffer"
            Members : |+1
                AABB Data[];
            Qualifiers : "restrict"
            PerUsageQualifiers : 
                AssignLightsToClustersBVH : "readonly"
    Debug : 
        ClusterColors : 
            Type : "StorageTexelBuffer"
            Format : "rgba8"
            Qualifiers : "restrict readonly"
        DebugClustersIndirectArgs :
            Type : "StorageBuffer"
            Members : |+1
                uint vertexCount;
                uint instanceCount;
                uint firstVertex;
                uint firstInstance;
        DebugClustersMatrices :
            Type : "UniformBuffer"
            Members : |+1
                mat4 dbView;
                mat4 dbProjection;

shader_interfaces :
    # Shaders can use multiple interfaces, layout specifications will be applied 
    # during generation. Users can also declare their own interfaces
    SharedVertexInputs :
        Members : |+1
            in vec3 position;
            in vec3 normal;
            in vec3 tangent;
            in vec2 uv;
    SharedVertexOutputs :
        Members : |+1
            out vec3 vPosition;
            out vec3 vNormal;
            out vec3 vTangent;
            out vec2 vUV;

compiler_options : 
    GenerateDebugInfo : false
    Optimization : "Performance"
    TargetVersion : "VulkanLatest"
    SourceLanguage : "GLSL"
    # Working directory is always default added during parse.
    # These are relative to that working directory, unless specified otherwise.
    IncludePaths : [
        "compute",
        "debug"
    ]

# These extensions are required to be supported, and are added to every shader
# declared in shader_groups
required_extensions : [
    "GL_EXT_control_flow_attributes",
    "GL_EXT_buffer_reference",
    "GL_EXT_buffer_reference2",
    "GL_EXT_buffer_reference_uvec2",
    "GL_EXT_nonuniform_qualifier"
]

shader_groups :
    UpdateLights : 
        ComputeShader : "compute/UpdateLights.comp"
    ReduceLights : 
        ComputeShader : "compute/ReduceLightsAABB.comp"
    ComputeMortonCodes : 
        ComputeShader : "compute/ComputeMortonCodes.comp"
    RadixSort : 
        ComputeShader : "compute/RadixSort.comp"
    MergeSort : 
        ComputeShader : "compute/MergeSort.comp"
    BuildBVH : 
        ComputeShader : "compute/BuildBVH.comp"
    DepthPrePass : 
        RenderShaders : 
            Vertex : "Default.vert"
        # Use DepthOnly tag to force front-end to attach a depth stencil output
        # These shaders probably don't write to the backbuffer for color but
        # we want to keep depth info.
        Tags : [ "DepthOnly" ]
    ClusterSamples : 
        RenderShaders : 
            Vertex : "Default.vert"
            Fragment : "ClusterSamples.frag"
        Tags : [ "DepthOnlyAsInput" ]
    FindUniqueClusters : 
        ComputeShader : "compute/FindUniqueClusters.comp"
    UpdateClusterIndirectArgs : 
        ComputeShader : "compute/UpdateClusterIndirectArgs.comp"
    AssignLightsToClustersBVH : 
        ComputeShader : "compute/AssignLightsToClustersBVH.glsl"
    AssignLightsToClusters :
        ComputeShader : "compute/AssignLightsToClusters.comp"
    DrawPass : 
        RenderShaders : 
            Vertex : "DrawID.vert"
            Fragment : "Clustered.frag"
    ComputeClusterAABBs : 
        ComputeShader : "compute/ComputeClusterAABBs.comp"
    DebugClusters : 
        RenderShaders : 
            Vertex : "debug/DebugClusters.vert"
            Geometry : "debug/DebugClusters.geom"
            Fragment : "debug/DebugClusters.frag"
    DebugLights : 
        RenderShaders : 
            Vertex : "debug/DebugLights.vert"
            Fragment : "debug/DebugLights.frag"

